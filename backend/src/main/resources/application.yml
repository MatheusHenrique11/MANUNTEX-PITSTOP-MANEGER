server:
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: pitstop-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pitstop}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pitstop}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
    issuer: pitstop.manutex.com

  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    bucket: ${STORAGE_BUCKET:pitstop-docs}
    region: ${AWS_REGION:us-east-1}
    presigned-url-expiry-minutes: 5

  rate-limit:
    capacity: 60
    refill-tokens: 60
    refill-duration-seconds: 60

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  seed:
    enabled: ${SEED_TEST_USER:false}
    email: ${SEED_EMAIL:demo@managerpitstop.com.br}
    password: ${SEED_PASSWORD:}
    full-name: ${SEED_FULL_NAME:Super Admin Demo}
    empresa-nome: ${SEED_EMPRESA_NOME:Manager PitStop Demo}
    empresa-cnpj: ${SEED_EMPRESA_CNPJ:11.222.333/0001-81}
    empresa-cidade: ${SEED_EMPRESA_CIDADE:São Paulo}
    empresa-uf: ${SEED_EMPRESA_UF:SP}

  frontend-url: ${FRONTEND_URL:http://localhost:4200}

  notification:
    whatsapp:
      enabled: ${WHATSAPP_ENABLED:false}
    email:
      enabled: ${MAIL_ENABLED:false}
    document-expiry-alert-days: 7

billing:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-starter: ${STRIPE_PRICE_STARTER:}
    price-professional: ${STRIPE_PRICE_PROFESSIONAL:}
    price-enterprise: ${STRIPE_PRICE_ENTERPRISE:}
  nfe:
    api-url: ${FOCUS_NFE_API_URL:https://homologacao.focusnfe.com.br}
    api-token: ${FOCUS_NFE_TOKEN:}
    municipio-prestador: ${NFE_MUNICIPIO_PRESTADOR:3550308}
  platform-fiscal:
    cnpj: ${PLATFORM_FISCAL_CNPJ:}
    razao-social: ${PLATFORM_FISCAL_RAZAO_SOCIAL:RiseCode Studio}
    inscricao-municipal: ${PLATFORM_FISCAL_INSCRICAO_MUNICIPAL:}
    codigo-municipio: ${PLATFORM_FISCAL_CODIGO_MUNICIPIO:${NFE_MUNICIPIO_PRESTADOR:3550308}}
    codigo-servico-municipal: ${PLATFORM_FISCAL_CODIGO_SERVICO:}
    item-lista-servico: ${PLATFORM_FISCAL_ITEM_LISTA_SERVICO:1.01}
    aliquota-iss: ${PLATFORM_FISCAL_ALIQUOTA_ISS:2.00}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

togglz:
  enabled: true
  feature-enums: com.manutex.pitstop.config.AppFeatures
  console:
    enabled: true
    path: /admin/toggles
    secured: true

logging:
  level:
    root: WARN
    com.manutex.pitstop: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
