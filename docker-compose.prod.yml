# Manager PitStop — Produção (VPS Hostinger 2.25.151.136)
#
# PRÉ-REQUISITOS na VPS:
#   - Traefik rodando na rede: riggingcheck_network
#   - Container risecode_postgres rodando na rede: risecode_default
#   - Banco managerpitstop_db e usuário criados (ver DEPLOY.md)
#   - Arquivo .env.production preenchido
#
# BUILD LOCAL (rodar da raiz do projeto):
#   docker build -f backend/Dockerfile -t managerpitstop/backend:latest .
#
# DEPLOY:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# VALIDAR:
#   docker compose -f docker-compose.prod.yml --env-file .env.production config

version: "3.9"

services:

  managerpitstop_backend:
    image: managerpitstop/backend:latest
    container_name: managerpitstop_backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - managerpitstop_network  # rede interna isolada
      - risecode_default         # acesso ao container risecode_postgres
      - riggingcheck_network     # Traefik está nesta rede
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=riggingcheck_network"
      - "traefik.http.routers.managerpitstop.rule=Host(`api.managerpitstop.com.br`)"
      - "traefik.http.routers.managerpitstop.entrypoints=websecure"
      - "traefik.http.routers.managerpitstop.tls=true"
      - "traefik.http.routers.managerpitstop.tls.certresolver=letsencrypt"
      - "traefik.http.services.managerpitstop.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  managerpitstop_network:
    name: managerpitstop_network

  # Rede do risecode_postgres
  risecode_default:
    external: true

  # Rede onde o Traefik do RiggingCheck está rodando
  riggingcheck_network:
    external: true
